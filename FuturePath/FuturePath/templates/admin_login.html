<!DOCTYPE html>

<html>

    <head>
        
        <title>Admin Login</title>

        <script src="https://cdn.tailwindcss.com"></script>

    </head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<form method="POST"

 action="/admin-login"

  class="bg-white p-8 rounded-xl shadow w-[350px]">

  <h1 class="text-2xl font-bold text-center mb-6">Admin Login</h1>

<input type="text" name="username" placeholder="admin" required class="w-full border p-2 rounded mb-4">

<input type="password" name="password" placeholder="admin123" required class="w-full border p-2 rounded mb-6">

<button type="submit" class="w-full bg-blue-600 text-white py-2 rounded">Login</button>

<p class="text-xs text-center mt-2 text-gray-400">admin / admin123</p>

</form>

</body>

</html>
